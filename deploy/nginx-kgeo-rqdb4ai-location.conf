    # Kurage GEO Cloud Run -> RQDB4AI HTTPS gateway.
    # Expose only the endpoints required by the kgeo RQ client.
    location = /kgeo-rqdb4ai/healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18300/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /kgeo-rqdb4ai/api/enqueue {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18300/api/enqueue;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/kgeo-rqdb4ai/api/jobs/[0-9a-fA-F-]+(?:/result)?$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/kgeo-rqdb4ai/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
